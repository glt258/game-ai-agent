verification:
  status: partially_verified
  conflicts: []
  notes:
    - "Release gate PASSED: Fadia is officially released and legal to record. The official Version 1.2 '999 Nights' Patch Notes (2026-07-06) list Fadia as an S-Class Standard character (S-Class Standard Character Selection Box: Sakiri, Baicang, Hathor, Fadia, Daffodill, Jiuyuan); her presence on the official NTE website character roster provides primary identity support."
    - "The official Version 1.2 material supports the S-Class rank and the faction context (Bureau of Anomaly Control / ETD); it establishes Fadia's presence in the S-Class Standard Character Selection Box, but acquisition-pool status is intentionally not stored in combat.native_taxonomy because it is distribution metadata rather than a combat taxonomy label. No official debut announcement stating Fadia's release version or date was located (the official news channels carry no Fadia banner post, consistent with her being a Standard-pool character), so identity.release is left null rather than inferred."
    - "All kit detail (ability names and summaries, Lilith state, Destructive Experience, Furnace of Guilt, Denial and Plunder, Awakenings) is supported only by the consulted secondary database (NTEBUILD.COM), which transcribes in-game text; per the ingestion rule and the NTE norm (the Shinku golden record likewise uses a second-party guide for kit detail), talent-level sub-facts keep the record at partially_verified."
    - "Damage-model distinctions are preserved as worded: All Eyes on Me REDIRECTS a portion of teammates' damage to Fadia while her HP is above 1, and SHARES incoming damage with surviving teammates (absorbing the remainder herself) once her HP reaches 1. No shield, invulnerability, or damage-reduction mechanic is attributed to Fadia; the 'before any shield mitigation' clause refers to the ordering of her redirect relative to shielding by other sources. HP == 1 is recorded only as a conditional branch in the mechanic: the facts state what changes when her HP reaches 1, and no HP floor, survival guarantee, or cannot-die property is asserted because no accepted source states one."
    - "The Basic Passive is driven by external team events (teammates taking damage), which the schema cannot express as a MechanicRef source node; it is represented as TeamMechanics.interactions + a relation from the passive ability. This matches the Shorekeeper external-team-event pattern and is recorded as an external-team-event graph friction sample, not a fake node."
    - "Destructive Experience is a named enemy-target state and is modeled as a StateFact with subject_scope target (a schema-supported scope); Lilith is modeled as a StateFact with subject_scope self. No party-scope state was needed: the team effects are represented in TeamMechanics (buffs / interactions)."
    - "resources: [] — the kit has no character-specific named resource; HP and Energy are global combat stats (the Ultimate's Energy restoration and the lost-HP/Destructive Threshold condition reference global systems, not a Fadia-specific meter)."
    - "Squad-number discrepancy: NTEBUILD.COM states 'Bureau of Anomaly Control, ETD-4' while Moegirlpedia's NTE roster lists 'E.T.D六队' (ETD Squad 6). The facts record only the confirmed organization name (Bureau of Anomaly Control / ETD) without a squad number; the discrepancy is left for human review."
    - "zh-CN localized name '法帝娅' is taken from the Moegirlpedia NTE roster (secondary); no official CN source was reachable on this host."
    - "No leaks, beta-only data, datamines, private-server data, Reddit or forum speculation, or search snippets were used; NTEBUILD.COM's 'ALL NTE LEAKS' site label was cross-checked by confirming Fadia's released status via official Version 1.2 patch-notes material."