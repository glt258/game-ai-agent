  abilities:
    - ability_id: basic_attack
      native_name: "Wordless Rejection"
      native_category: "Basic Attack"
      normalized_category: null
      description_summary: "Swings her cross shield and performs up to five consecutive attacks dealing Psyche DMG."
    - ability_id: basic_passive
      native_name: "All Eyes on Me"
      native_category: "Basic Passive"
      normalized_category: null
      description_summary: "While Fadia's current HP is above 1, she redirects a portion of damage taken by teammates to herself, before any shield mitigation. Once her HP drops to 1, she ceases redirecting and instead shares incoming damage with surviving teammates before absorbing the remainder herself."
    - ability_id: charged_basic
      native_name: "Falling Contempt"
      native_category: "Charged Basic"
      normalized_category: null
      description_summary: "Swinging her cross shield in the air, she plunges and deals one instance of Psyche DMG to an area on impact; damage increases with fall height, up to 100%."
    - ability_id: dodge_counter_basic
      native_name: "Critical Riposte: Evasion Trigger"
      native_category: "Dodge Counter Basic"
      normalized_category: null
      description_summary: "Triggers when casting Wordless Rejection after a Critical Dodge: charges toward the target at high speed and deals one instance of Psyche DMG to an area, reducing Break."
    - ability_id: skill
      native_name: "Existence"
      native_category: "Redirect Skill"
      normalized_category: null
      description_summary: "Deals one instance of Psyche DMG to an area and inflicts Destructive Experience on the enemy with the highest Max HP. During its duration, when Fadia takes damage, the marked target shares a percentage of that damage. Destructive Experience ends when its duration expires, when the redirected damage reaches its cap, or when the target and Fadia leave combat."
    - ability_id: ultimate
      native_name: "Agony to Euphoria"
      native_category: "Ultimate"
      normalized_category: null
      description_summary: "Enters the Lilith state, dealing six instances of Mental DMG and restoring HP. While in Lilith, recasting Wordless Rejection performs up to five follow-up attacks that each deal Mental DMG. When Fadia's lost HP reaches the Destructive Threshold, her Energy is fully restored, and the move deals more damage and restores more HP when cast with lost HP at or above the Destructive Threshold. The Lilith state ends when its duration ends, when all five follow-up attacks are performed, when characters are switched, or when other skills are used."
    - ability_id: passive_1
      native_name: "Furnace of Guilt"
      native_category: "Passive"
      normalized_category: null
      description_summary: "Nova Enhancement: when the Nova state on a target ends, drains 10% of Fadia's base Max HP from the target at 5% efficiency; the total drained cannot exceed 50% of Fadia's base Max HP. Both parties' stats are restored upon exiting combat."
    - ability_id: passive_2
      native_name: "Denial and Plunder"
      native_category: "Passive"
      normalized_category: null
      description_summary: "While Fadia is in the team, increases the team's Max HP by 10%."
