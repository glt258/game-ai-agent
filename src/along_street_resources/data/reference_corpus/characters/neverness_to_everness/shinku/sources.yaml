  notes:
    - "Official Version 1.2 material supports Shinku's name, S-Class rank, release window beginning July 8, 2026, and the associated limited Arc Blushing Mirage."
    - "The official English character page establishes the organization Bureau of Anomaly Control and identifies Shinku as part of ETD-6, with the wording 'The combat core of ETD-6. The enforcer who never misses a mission.'"
    - "The official es-ES App Store character event records the localized affiliation wording UAC-2 de la ACA. ACA is reconciled only at the organization level with Bureau of Anomaly Control."
    - "UAC-2 versus ETD-6 remains an unresolved localized unit-token conflict; the normalized production affiliation uses the directly evidenced official English unit ETD-6."
    - "No alias relationship between UAC-2 and ETD-6 is claimed. The Spanish official source is retained for historical provenance despite its conflicting localized unit token."
    - "Cosmos, Synthesis, ability names, Defiant Spirit, Menacing Gaze, Surging Crimson, Charge Enhancement, and mechanic relations are supported only by the consulted secondary guide."
    - "No native character ID, confirmed localized character name, occupation, objective public identity, official visual tags, or official character keywords were established from the accepted sources; those fields remain null or empty."
    - "Official marketing wording such as awkward dragon girl was not promoted into narrative identity or presentation facts."
    - "No leaks, beta values, datamines, private-server data, Reddit, forum speculation, search snippets, or model memory were used."
