verification:
  status: partially_verified
  conflicts: []
  notes:
    - "Identity core facts (Shorekeeper, Spectro, 5-star, released in Version 1.3 on 2024-09-29, guardian of the Black Shores) are directly supported by the official Version 1.3 'To the Shore's End' Patch Notes (primary); the Profile Reveal and the convene notice confirm the canonical name, the 5-star rating, and the Version 1.3 banner window. The official patch notes label her Combat Roles as 'Support and Healer, Traction, DMG Amplification'; as a native, game-published classification this tag is recorded in facts.yaml under combat.native_taxonomy.labels.combat_roles. Only the cross-game normalized role mapping (e.g. the NormalizedRole vocabulary of character-analysis/0.1) remains reserved for the future CharacterAnalysis."
    - "The full live kit (ability names, Stellarealm stages, butterfly entities, Empirical/Deductive Data, Inherent Skills) is supplied by two independent secondary sources — Wuthering Wiki (full EN in-game kit text) and Moegirlpedia (full CN in-game kit text) — that agree on every mechanic and number; per ingestion policy these secondary-only sub-facts keep the record at partially_verified. The CN native names of the two Inherent Skills could not be cross-checked (the Moegirlpedia page omits the Inherent Skill section), so only the official EN names are recorded. Exact magnitudes (e.g. the 30s Stellarealm duration) come from the Wuthering Wiki attributes tables."
    - "Stellarealm representation: the multi-stage zone (Outer → Inner → Supernal Stellarealm) has a party-scoped subject, so it is not a StateFact (subject_scope cannot honestly be self/target/unknown); it is modeled as a TeamInteractionFact + TeamMechanics buffs/healing, matching the Universal Revelry precedent. Stage evolution is triggered by any party member's Intro Skill used within the realm — a teammate action that cannot be expressed as a MechanicRef in Shorekeeper's own ability graph, so that evolution trigger edge is recorded as graph friction rather than a relation."
    - "Butterfly entities: the CN in-game kit text assigns 召唤 (summon) to the five Dim Star Butterflies (Resonance Skill and Intro Skill) and to the Outro's orbiting pair, and 生成/演化为 to Flare Star Butterflies evolving from Collapsed Cores; all are persistent entity-style summons with source-stated auto-tracking attacks. This reproduces Furina's summon graph friction (the butterflies cannot be MechanicRef targets because summons is a list[str] field), recorded as repeated, non-blocking friction; no schema change is proposed."
    - "Narrative wording: the official patch notes and Profile Reveal frame 'The Shorekeeper, guardian of the Black Shores' as her title, and 'Euphonic Chrysalis' appears as the official epithet in the Profile Reveal / Resonator Review titles. The in-game profile (carried by Moegirlpedia) additionally designates her as the 'Second Instance' (第二实例) in the Black Shores record. That internal designation is not a public identity and is deliberately excluded from facts; public_identity keeps the official guardian wording."