combat:
  native_taxonomy:
    labels:
      attribute: "Spectro"
      weapon_type: "Rectifier"
      rarity: "5-star"
      combat_roles:
        - "Support and Healer"
        - "Traction"
        - "DMG Amplification"
  abilities:
    - ability_id: normal_attack
      native_name: "Origin Calculus"
      native_category: "Normal Attack"
      normalized_category: null
      description_summary: "Performs up to four consecutive Spectro strikes; each hit generates a Collapsed Core. Holding the attack button enters the Unbound Form stance, which consumes stamina, accumulates one Deductive Data segment per second and automatically collects nearby plant collectibles; ending the stance deals Spectro DMG and converts each accumulated Deductive Data segment into Empirical Data while generating a Collapsed Core. Mid-air and Dodge Counter attacks deal Spectro DMG, and the Mid-air Attack also generates a Collapsed Core."
    - ability_id: resonance_skill
      native_name: "Chaos Theory"
      native_category: "Resonance Skill"
      normalized_category: null
      description_summary: "Restores HP for all nearby party members and summons five Dim Star Butterflies that automatically track and attack a target, dealing Spectro DMG. Can be cast in mid-air; a timely follow-up Basic Attack resumes the combo from Stage 2."
    - ability_id: resonance_liberation
      native_name: "End Loop"
      native_category: "Resonance Liberation"
      normalized_category: null
      description_summary: "Generates the Outer Stellarealm, which continuously restores HP for all party members within its effective range (one trigger every 3s, realm lasting 30s). When a party member uses an Intro Skill within it, the realm evolves into the Inner Stellarealm, and a further party Intro Skill evolves it into the Supernal Stellarealm; each stage inherits the effects of the previous stages."
    - ability_id: forte_circuit
      native_name: "Astral Chord"
      native_category: "Forte Circuit"
      normalized_category: null
      description_summary: "Normal Attack hits generate floating Collapsed Cores that transform into Flare Star Butterflies after 6s; each butterfly automatically tracks and attacks a target, dealing Spectro DMG. With five Collapsed Cores present, the next Basic Attack hit instantly converts one into a Flare Star Butterfly. While holding five Empirical Data segments, Heavy Attack Illation pulls in nearby targets and deals Spectro DMG, or Mid-air Attack Transmutation deals Spectro DMG; both consume all segments and instantly convert all Collapsed Cores into Flare Star Butterflies. Empirical Data is gained from Basic Attack Stages 1, 2 and 4 (1 segment each), Stage 3 (2 segments), Mid-air Attack (1) and Dodge Counter (1), with a cap of 5."
    - ability_id: intro_skill
      native_name: "Proof of Existence"
      native_category: "Intro Skill"
      normalized_category: null
      description_summary: "Enlightenment: Shorekeeper appears, restores HP for all nearby party members, and summons five Dim Star Butterflies that automatically track and attack a target, with the damage counted as Resonance Skill DMG. While a Supernal Stellarealm is active, her Intro Skill is replaced once by Discernment, which ends the current Stellarealm, restores HP for all nearby party members, and deals a guaranteed-critical Spectro attack counted as Resonance Liberation DMG."
    - ability_id: outro_skill
      native_name: "Binary Butterfly"
      native_category: "Outro Skill"
      normalized_category: null
      description_summary: "Summons one Flare Star Butterfly and one Dim Star Butterfly to circle the on-field Resonator for up to 30s: while they circle, if the on-field Resonator is hit or launched, tapping Dodge recovers from the interruption and counts as a successful dodge (up to 5 triggers), and all nearby party members' DMG is amplified by 15%."
    - ability_id: inherent_life_entwined
      native_name: "Life Entwined"
      native_category: "Inherent Skill"
      normalized_category: null
      description_summary: "When a Resonator other than Shorekeeper takes a fatal blow, they are not knocked out but healed for 50% of Shorekeeper's HP, while Shorekeeper loses the same amount of HP (her HP cannot drop below 1 from this effect). This effect can trigger once every 10 minutes."
    - ability_id: inherent_self_gravitation
      native_name: "Self Gravitation"
      native_category: "Inherent Skill"
      normalized_category: null
      description_summary: "While the on-field Resonator is within range of a Stellarealm, Shorekeeper's Energy Regen is increased by 10%; Rover's Energy Regen is also increased by 10% if Rover is on the team."
  mechanics:
    resources:
      - resource_id: empirical-data
        native_name: "Empirical Data"
        description_summary: "Forte resource capped at 5 segments, gained when Basic Attack Stages 1/2/4 (1 segment), Stage 3 (2 segments), Mid-air Attack (1) or Dodge Counter (1) hits a target, and when each Deductive Data segment converts on exiting Unbound Form; all segments are consumed by Illation or Transmutation."
        cap: 5
      - resource_id: deductive-data
        native_name: "Deductive Data"
        description_summary: "Intermediate segment accumulated once per second while the Unbound Form stance is held; when the stance ends, each accumulated segment converts into one Empirical Data segment and generates one Collapsed Core."
        cap: null
    states:
      - state_id: unbound-form
        native_name: "Unbound Form"
        subject_scope: self
        description_summary: "Self-stance entered by holding the Basic Attack button (Heavy Attack): it consumes stamina, generates one Deductive Data segment per second and automatically collects nearby plant collectibles; it ends when stamina runs out or a Basic Attack is cast, dealing Spectro DMG and converting accumulated Deductive Data into Empirical Data while generating Collapsed Cores."
    transformations: []
    summons:
      - "Dim Star Butterflies (黯星·蝶): five entities summoned by Resonance Skill Chaos Theory and Intro Skill Enlightenment; they automatically track and attack a target, dealing Spectro DMG (Intro-summoned butterflies deal Resonance Skill DMG)."
      - "Flare Star Butterflies (耀星·蝶): entities generated when Collapsed Cores evolve 6s after a Normal Attack hit, when the next Basic Attack converts one of five Cores, and when Illation or Transmutation instantly converts all Cores; they automatically track and attack a target, dealing Spectro DMG."
      - "Outro butterflies: Binary Butterfly summons one Flare Star Butterfly and one Dim Star Butterfly that circle the on-field Resonator for up to 30s, granting recovery from hit/launch interruption via a dodge input (up to 5 triggers) and amplifying all nearby party members' DMG by 15%."
    mobility_mechanics:
      - "Chaos Theory can be cast in mid-air."
    targeting_mechanics:
      - "Dim Star Butterflies automatically track and attack a target after being summoned by the Resonance Skill or Intro Skill."
      - "Flare Star Butterflies automatically track and attack a target after evolving from Collapsed Cores."
  team_mechanics:
    buffs:
      - "Inner Stellarealm: all party members within its effective range gain CRIT Rate increased by 0.01% for every 0.2% of Shorekeeper's Energy Regen, up to 12.5%."
      - "Supernal Stellarealm: all party members within its effective range gain CRIT DMG increased by 0.01% for every 0.1% of Shorekeeper's Energy Regen, up to 25%."
      - "Binary Butterfly: while the Outro butterflies circle the on-field Resonator (up to 30s), all nearby party members' DMG is amplified by 15%."
      - "Self Gravitation: while the on-field Resonator is within a Stellarealm's range, Shorekeeper's Energy Regen is increased by 10% (and Rover's Energy Regen by 10% if Rover is on the team)."
    debuffs: []
    healing:
      - "Chaos Theory (Resonance Skill): restores HP for all nearby party members."
      - "Outer Stellarealm: continuously restores HP for all party members within its effective range, one trigger every 3s."
      - "Enlightenment (Intro Skill): restores HP for all nearby party members."
      - "Discernment (Intro Skill variant during the Supernal Stellarealm): ends the current Stellarealm and restores HP for all nearby party members."
      - "Life Entwined (Inherent Skill): when another Resonator takes a fatal blow, they are healed for 50% of Shorekeeper's HP instead of being knocked out, at the cost of the same amount of Shorekeeper's HP (her HP cannot drop below 1 from this effect); once every 10 minutes."
    shielding: []
    grouping:
      - "Illation (Forte Circuit): with five Empirical Data segments, Heavy Attack pulls in nearby targets."
    off_field_effects:
      - "The Stellarealm generated by End Loop persists for 30s, restoring HP for all party members within its effective range and applying its stage buffs, and its stage evolution is triggered by party members' Intro Skills used within it; the stated effects are tied to the realm's range and duration rather than to Shorekeeper remaining the on-field Resonator."
      - "Summoned Dim Star Butterflies and Flare Star Butterflies act autonomously, automatically tracking and attacking a target once created, without requiring Shorekeeper to remain the on-field Resonator."
    interactions:
      - interaction_id: stellarealm
        native_name: "Stellarealm"
        description_summary: "The zone generated by Resonance Liberation End Loop (30s duration): as the Outer Stellarealm it continuously restores HP for all party members within its effective range once every 3s; when a party member uses an Intro Skill within it, it evolves into the Inner Stellarealm (party CRIT Rate scaling from Shorekeeper's Energy Regen, cap 12.5%), and a further party Intro Skill within it evolves it into the Supernal Stellarealm (party CRIT DMG scaling from Shorekeeper's Energy Regen, cap 25%); each stage inherits the previous stages' effects, and while the Supernal stage is active Shorekeeper's Intro Skill is replaced once by Discernment, whose cast ends the Stellarealm."
