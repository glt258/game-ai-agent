    - ability_id: normal_attack
      native_name: "Impromptu Show"
      native_category: "Normal Attack"
      normalized_category: null
      description_summary: "Performs up to four consecutive pistol shots dealing Fusion DMG. A Charged Attack consumes stamina to enter an aiming state and fire a precise shot dealing Fusion DMG. Mid-air Attack consumes stamina to fire a shot in mid-air dealing Fusion DMG. Dodge Counter deals Fusion DMG. Normal Attack hits generate Annoyance."
    - ability_id: resonance_skill
      native_name: "Passionate Variation"
      native_category: "Resonance Skill"
      normalized_category: null
      description_summary: "Fires a shot dealing Fusion DMG to enemies in front. A successful hit generates Annoyance. Within 5s after casting, subsequent Normal Attack hits restore additional Annoyance. When Annoyance reaches 100, this ability is replaced by Fury Fugue."
    - ability_id: resonance_liberation
      native_name: "Violent Finale"
      native_category: "Resonance Liberation"
      normalized_category: null
      description_summary: "Unleashes a barrage of coordinated attacks dealing Fusion DMG and applies Burning Rhapsody to all characters on the team for 10s."
    - ability_id: forte_circuit
      native_name: "Fury Fugue"
      native_category: "Forte Circuit"
      normalized_category: null
      description_summary: "When Annoyance reaches 100, the Resonance Skill is replaced by Fury Fugue. Casting Fury Fugue consumes all Annoyance and unleashes a powerful barrage of coordinated attacks dealing Fusion DMG. After casting Passionate Variation, the next Fury Fugue deals increased DMG for 8s via Harmonic Control."
    - ability_id: intro_skill
      native_name: "Dissonance"
      native_category: "Intro Skill"
      normalized_category: null
      description_summary: "Enters the field and fires a shot dealing Fusion DMG; a successful hit generates Annoyance."
    - ability_id: inherent_harmonic_control
      native_name: "Harmonic Control"
      native_category: "Inherent Skill"
      normalized_category: null
      description_summary: "After casting Passionate Variation, the next Fury Fugue deals 25% increased DMG for 8s."
