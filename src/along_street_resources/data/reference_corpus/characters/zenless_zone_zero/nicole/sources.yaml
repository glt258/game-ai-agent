verification:
  status: partially_verified
  conflicts: []
  notes:
    - "Identity facts are primary: the official character roster page (content_v2 character channel, iInfoId 102183, zh-CN and en-US payloads) provides the canonical name Nicole Demara / 妮可·德玛拉, the Cunning Hares (狡兔屋) faction, the official intro text, and, via its official asset metadata, the A-Rank (level-icon 'Arank'), the Ether attribute (prop-icon-1 '以太') and the Support specialty (prop-icon-2 '支援'). The official launch announcement gives the July 4, 2024 global launch date."
    - "Kit ability facts (skill names and move summaries) are supported by the Moegirlpedia transcription of the official in-game zh-CN skill text; per the ingestion policy, talent-detail sub-facts whose only source is secondary keep the record at partially_verified."
    - "No official 'Agent Mechanics Intro' post exists for Nicole (the official mechanic-introduction series began at Version 1.0 with Rina and Soldier 11, after Nicole's launch), and the official site publishes no full in-game kit text. EN-specific in-game skill names were therefore not retrievable on this host; native_category uses the official EN UI slot labels (Basic Attack / Dodge / Assist / Special Attack / EX Special Attack / Chain Attack / Ultimate / Core Passive) while native_name uses the source-supported official zh-CN in-game skill names (狡兔连打, 脱兔, 糖衣炮弹, 夹心糖衣炮弹, 高价以太爆弹, 特制以太榴弹, 机关箱) cross-checked in the summaries. The Assist slot carries three distinct named moves (救急炮击, 狡兔出手!, 趁虚而入) with no single slot-level name, so its native_name is left null rather than picking one."
    - "Core Passive (机关箱) existence and its debuff nature are supported by official in-game text transcribed by Moegirlpedia (the Mindscape Cinema 2 entry references 'the debuff effect of Core Passive: 机关箱'); the debuff's exact parameters are not present in the consulted sources and are deliberately not inferred. The Additional Ability is likewise not recorded because no consulted source carries its text."
    - "The continuous-pull energy field created by EX Special Attack / Chain Attack / Ultimate is modeled as TeamMechanics.grouping (a placed area effect that continuously pulls surrounding enemies and deals Ether DMG). It is not modeled as a StateFact: no named persistent state with a self/target subject is defined, and treating a placed field as a state would over-StateFact the kit. Field duration and whether the field persists after Nicole leaves the field are not explicit in the consulted sources, so off_field_effects is left empty."
    - "Quick Assist triggering on hit is part of Nicole's kit wording but is the game's systemic Quick Assist mechanic; it is described in the ability summaries and is not modeled as a character-specific TeamInteractionFact. The Ultimate's squad Energy recovery (10 Energy to other squad members, +20 to the next character swapped in) is Nicole-specific kit text and is modeled as one team interaction with a relation from the Ultimate."
    - "resources: [] — ZZZ's Energy is a game-generic combat resource, not a Nicole-specific resource, so no ResourceFact is recorded per the corpus rule."
    - "Launch-era official materials establish Nicole's presence around launch, but exact release fields are intentionally left null because the current source set does not directly support those exact field values. The game's global launch (July 4, 2024, Version 1.0) is documented by the official launch announcement, and the launch-window character demo/PV posts show Nicole was present at launch, but no first-party statement explicitly and directly binds Nicole's own availability/release to Version 1.0 or 2024-07-04."
    - "No leaks, datamines, beta-only data, private-server data, Reddit or forum speculation, tier lists, or build guides were used."