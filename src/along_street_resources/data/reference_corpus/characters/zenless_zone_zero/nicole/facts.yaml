  abilities:
    - ability_id: basic_attack
      native_name: "狡兔连打"
      native_category: "Basic Attack"
      normalized_category: null
      description_summary: "Performs up to three consecutive strikes dealing Physical DMG (zh-CN skill name: 狡兔连打). After unleashing Special Attack, EX Special Attack, Chain Attack, or Ultimate, Nicole reloads and strengthens her Normal Attack and Dash Attack, increasing bullet damage; this reload effect can trigger up to eight times (zh-CN: 为所欲为)."
    - ability_id: dodge
      native_name: "脱兔"
      native_category: "Dodge"
      normalized_category: null
      description_summary: "A quick dash with invincibility during the move (zh-CN: 脱兔). Dash Attack (惊喜开箱) dashes in the held direction and strikes nearby enemies for Physical DMG, or evades backwards and fires a ranged Physical attack when no direction is held. A Perfect Dodge unlocks the Dodge Counter (牵制炮击): an invincible backward evade that fires a ranged Ether attack. Dash Attack and Dodge Counter reload and strengthen the Normal and Dash Attacks (up to eight triggers)."
    - ability_id: assist
      native_name: null
      native_category: "Assist"
      normalized_category: null
      description_summary: "Assist moves activated from the assist button: Quick Assist (救急炮击) — when the on-field character is knocked airborne, Nicole evades backwards and fires a ranged Ether attack; Defensive Assist (狡兔出手!) — parries the enemy's incoming attack while invincible, accumulating substantial Daze; Assist Follow-Up (趁虚而入) — after Defensive Assist, darts forward and fires a cannon at the enemy, dealing Ether DMG. Each Assist move afterwards reloads and strengthens the Normal and Dash Attacks (up to eight triggers)."
    - ability_id: special_attack
      native_name: "糖衣炮弹"
      native_category: "Special Attack"
      normalized_category: null
      description_summary: "Fires a ranged Ether attack at enemies ahead (zh-CN: 糖衣炮弹) with increased interruption resistance during the move; afterwards reloads and strengthens the Normal and Dash Attacks (up to eight triggers)."
    - ability_id: ex_special_attack
      native_name: "夹心糖衣炮弹"
      native_category: "EX Special Attack"
      normalized_category: null
      description_summary: "When sufficient Energy is available, fires a powerful ranged Ether attack and creates an energy field at the target location that continuously pulls enemies toward it and deals Ether DMG (zh-CN: 夹心糖衣炮弹). Holding the button charges the shot, forming a small energy field at the muzzle that continuously consumes Energy and deals extra damage to nearby enemies. The move grants invincibility, triggers the game's Quick Assist when it hits an enemy, and afterwards reloads and strengthens the Normal and Dash Attacks."
    - ability_id: chain_attack
      native_name: "高价以太爆弹"
      native_category: "Chain Attack"
      normalized_category: null
      description_summary: "Fires a powerful ranged Ether attack at enemies in a small area in front (zh-CN: 高价以太爆弹) and creates an energy field at the target location that continuously pulls surrounding enemies toward it and deals Ether DMG. The move grants invincibility, triggers the game's Quick Assist when it hits, and afterwards reloads and strengthens the Normal and Dash Attacks."
    - ability_id: ultimate
      native_name: "特制以太榴弹"
      native_category: "Ultimate"
      normalized_category: null
      description_summary: "Unleashed when the Decibel level reaches Extreme, this powerful ranged Ether attack (zh-CN: 特制以太榴弹) also creates an energy field at the target location that continuously pulls surrounding enemies and deals Ether DMG. Other squad members recover 10 Energy, and the next character to be swapped in recovers an additional 20 Energy. The move grants invincibility, triggers the game's Quick Assist when it hits, and afterwards reloads and strengthens the Normal and Dash Attacks."
    - ability_id: core_passive
      native_name: "机关箱"
      native_category: "Core Passive"
      normalized_category: null
      description_summary: "Nicole's Core Passive (zh-CN: 机关箱) applies a debuff when its condition is met. The consulted sources do not specify the debuff's exact effect, magnitude, duration, or affected targets, so those parameters are not recorded."
