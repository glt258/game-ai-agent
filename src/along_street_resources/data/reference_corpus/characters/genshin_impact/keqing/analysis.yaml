character_design:
  character_fantasy: >-
    Playing Keqing is a mobility-driven melee combat experience: the
    player places a mark at range, teleports straight into the fight,
    converts the blade into a briefly enhanced weapon, and floods the target
    with rapid strikes before bursting and resetting — a fantasy of precise,
    aggressive, self-directed mobility rather than slow buildup.
