verification:
  status: partially_verified
  conflicts: []
  notes:
    - "Identity (Nahida, Dendro, Catalyst, 5-star, released in Version 3.2), the native taxonomy, and the core combat mechanics — Elemental Skill All Schemes to Know (Press/Hold, Seed of Skandha, linked opponents, Tri-Karma Purification triggered by Elemental Reactions or Dendro Core DMG) and Elemental Burst Illusory Heart (Shrine of Maya domain with Pyro/Electro/Hydro party-composition effects, enhanced at 2+ members, retained off-field) — are directly supported by the official Version 3.2 Update Notes (primary), which list Nahida as a new character of Version 3.2. The official wish announcement 「月草的赐慧」 (published 2022-11-02) directly establishes her availability: it states that the limited 5-star character 「白草净华·纳西妲(草)」 is featured in the event wish whose period opened on 2022-11-02; both sources jointly support identity.release (version 3.2, date 2022-11-02)."
    - "Exact parameters beyond the patch-notes summaries — 8-mark cap and 25s Seed of Skandha duration, 2.5s Tri-Karma Purification trigger interval, 5s Aiming Mode, 15s base Shrine duration and per-element-type values, the 25%/250 Elemental Mastery share of Compassion Illuminated, and the 0.1%/0.03% (max 80%/24%) conversion of Awakening Elucidated — are supported only by two independent secondary transcriptions of the current in-game kit text (Moegirlpedia zh-CN and Genshin Center en); per the ingestion rules these secondary-only sub-facts keep the record at partially_verified."
    - "Passive mapping (confirmed by human review): 净善摄受明论 = Compassion Illuminated (1st Ascension Passive, Shrine Elemental Mastery share of 25% of the highest-EM party member, cap 250); 慧明缘觉智论 = Awakening Elucidated (4th Ascension Passive, Elemental Mastery beyond 200 converts to 0.1% Tri-Karma Purification Bonus DMG and 0.03% CRIT Rate per point, caps 80%/24%); 诸相随念净行 = On All Things Meditated (Utility Passive, harvestable-item interaction). Both secondary transcriptions (Moegirlpedia zh-CN verbatim in-game text and Genshin Center en in-game text) carry the same behaviors; Genshin Center's EN name-to-description assignment matches this confirmed mapping."
    - "Historical wording review: the official 3.2 patch-notes summary is intentionally less specific than the in-game kit ('一定范围内一定数量的敌人' and a trigger description without an interval, vs the kit's '至多8名敌人' and 2.5s detailed attribute). The same kit wording remains current in both secondary transcriptions, so this is a summary-vs-kit granularity difference, not a behavior change and not a later clarification; no source_relations were encoded (per the insufficient-evidence rule)."
    - "Off-field: the patch notes explicitly state Nahida retains the Shrine's composition bonuses while in the back of the party ('纳西妲即使处于队伍后台，只要该队伍处于摩耶之殿当中，依旧能获得上述效果的提升'), encoded in team_mechanics.off_field_effects. No reachable official text explicitly states whether Tri-Karma Purification itself triggers while Nahida is off-field; the kit text carries no field-presence condition but this is not an explicit statement, so it is recorded as a CANDIDATE (human-review item) and not encoded."
    - "The Collected Miscellany (拾枝杂谈) record is an official mechanics-oriented video whose content payload carries only the episode tagline and CV credits; the spoken/video content was not transcribed and supports no facts in this record. It is retained as a primary record because it is the official mechanics-education source for Nahida and a potential (unverified) source for the off-field Tri-Karma question."
    - "The official character page record hashes the content_v2 API payload for the character-detail article (iInfoId 118912), whose body is image-based (sExt assets); the images were not transcribed. The official Character Demo (117813) and PV (117793) were fetched and verified as marketing videos (tagline + CV only) and are excluded from the source records because they carry no facts."
