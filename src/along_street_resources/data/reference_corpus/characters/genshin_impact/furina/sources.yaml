  notes:
    - "Identity (Furina, Hydro, Sword, 5-star, released in Version 4.2 on 2023-11-08), the native taxonomy, and the core combat mechanics — Charged-Attack Arkhe alignment switch, Elemental Skill Salon Solitaire (Salon Members / Singer of Many Waters), and Elemental Burst Let the People Rejoice (Universal Revelry + Fanfare, including the 300 cap and reset at Burst end) — are directly supported by the official Version 4.2 Update Notes (primary)."
    - "Full talent-level details beyond the patch-notes summaries (Normal Attack meter and 'Arkhe: Seats Sacred and Profane', and the 1st/4th Ascension and Utility passives) are supported by two independent secondary sources (Moegirlpedia and Genshin Center) that carry the verbatim in-game kit text; per the ingestion rules these secondary-only sub-facts keep the record at partially_verified."
    - "The official ys.mihoyo character page and news-detail pages are JavaScript-rendered; their source records carry the official URLs with hashes of the fetched app shell / the official content API payload that backs the page."
    - "Narrative: official 4.2 marketing frames Furina as the 'absolute focus of the stage of judgment' and 'Queen of All Waters, All Peoples, and All Laws'. The 'former Hydro Archon (God of Justice)' phrase reflects Furina's post-4.2 in-game status but is secondary-lore-only and mixes a historical role with the current identity; it is therefore deliberately excluded from facts (narrative.public_identity kept null under conservative fact semantics), and the temporal-identity question remains a human-review watch item."
