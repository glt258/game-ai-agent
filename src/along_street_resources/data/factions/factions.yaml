    - 小型工作室经营者
    recruitment:
      description: 主要由南栈本地居民、经营者和长期工作者自愿加入，也接受与街区有稳定合作关系的独立职业者参与项目。
    culture:
      description: 重人情、重现场经验、反感空降式管理；内部意见非常多元，年轻成员与老店主之间经常就商业化、规则和开放程度争论。
  relationship:
    faction_001:
      status: cooperative
      description: 合作社经常借助协理人处理成员与房东、保险、活动方和公共部门之间的复杂纠纷。
    faction_002:
      status: cooperative
      description: 合作社允许研究中心开展自愿式社区项目，但会严格追问数据用途、退出机制和研究结果如何反馈给居民。
    faction_003:
      status: tense
      description: 双方围绕小商户能力责任险和风险评级长期争论，但现实经营仍需要保险服务，因此并未中断合作。
    faction_004:
      status: cooperative
      description: 霓桥为本地艺人和场地带来曝光与收入，也可能造成租金上涨、客流冲击和社区生活商业化。
    faction_005:
      status: cooperative
      description: 街区活动、消防、治安和急救需要稳定合作，合作社同时代表居民向公共部门反馈实际问题。
  knowledge_boundary:
    rules_source: data/knowledge/knowledge_rules.yaml
    public_information:
    - lore_id: lore_028
      summary: 南栈生活合作社由本地小店、居民、自由职业者和独立艺人共同组成，主要处理社区经营与公共议题。
    - lore_id: lore_029
      summary: 合作社公开反对把能力评级作为租赁、招聘和社区信用的默认筛选条件。
    member_information:
    - lore_id: lore_030
      summary: 合作社内部并不反对所有能力认证；大多数成员支持与消防、医疗、活动安全直接相关的明确专业规则。
    - lore_id: lore_031
      summary: 成员大会长期存在两派争论：一派希望借商业合作改善街区经济，另一派更担忧品牌化会挤压原有居民和小店。
    restricted_information:
    - lore_id: lore_032
      summary: 经营互助组正在整理成员遭遇的能力评级争议案例，计划与协理联合会共同推动更明确的申诉标准。
      access_requirement:
