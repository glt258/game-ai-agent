  story_functions:
  - 承载小店、学生、独立艺人和居民的高密度日常角色故事
  - 让标准化争议落到租金、工作、保险和邻里关系等具体生活问题
  - 提供城市更新、商业化与社区自治之间的长期冲突
  character_archetypes:
  - 经营家族小店但想改变旧规矩的年轻店主
  - 兼职乐手与社区志愿者
  - 反感大公司但很懂现实经营的合作社协调人
  - 刚搬来南栈、逐渐进入社区网络的自由职业者
  canon_constraints:
  - 南栈合作社不是地下反抗军或非法能力者庇护组织。
  - 合作社反对过度标准化，但不能拒绝合理的消防、医疗和公共安全规范。
  - 成员之间必须存在真实分歧，不能被写成统一意识形态共同体。
  - 普通成员不会自动知道其他成员的私人能力记录、合同或纠纷细节。
  - 南栈相关剧情应保留商业、社区和日常生活质感，而非沦为反政府据点。
