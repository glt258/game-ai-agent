- id: faction_001
  name: 临洲市协理人联合会
  short_name: 协理联合会
  type: professional_association
  status: active
  headquarters:
    city: 临洲市
    district: 中央湾
    description: 联合会秘书处设于中央湾公共服务与行业机构集中的街区，并在槐庭区、南栈街区和东港带设有常驻联络点。
  public_identity:
    description: 面向注册协理人和协理事务所提供职业培训、行业规范、项目转介、争议协调与公共合作服务的专业联合组织。
  public_reputation:
    description: 社会普遍把协理联合会视为处理跨机构麻烦事的实务型行业组织；评价通常取决于具体协理人的专业能力，而非其拥有行政权力。
    keywords:
    - 第三方协调
    - 实务
    - 调解
    - 跨机构
  core_function:
    description: 填补学校、企业、保险、公共部门与个人之间的责任缝隙，建立协理职业标准，并为复杂事件提供可追责的第三方协调机制。
  ideology:
    principles:
    - 复杂问题通常不能由单一机构独立解决。
    - 判断应尽量基于现场事实，而不是先按能力标签给人定性。
    - 标准化工具可以使用，但必须允许复核、申诉与人工判断。
  stance_on_main_conflict:
    summary: 有限支持能力测评和标准化，但反对将测评结果直接固化为个人身份、职业命运或责任判断。
    supports:
    - 透明且可复核的能力测评
    - 跨部门共享必要而有限的信息
    - 针对具体用途的风险认证
    opposes:
    - 以单次能力评级替代个案调查
    - 在无申诉机制的情况下长期保存高风险标签
    - 把回写效应简化成个人失控问题
  actual_goal:
    description: 提升协理职业的社会可信度与案件承接能力，使协理人在跨机构事件中成为有明确责任边界、可被信任且不可被任意甩锅的专业角色。
    visibility: internal
  internal_structure:
    description: 联合会规模中等，以行业治理、培训认证和案件协调为主，不直接指挥各独立事务所。
    divisions:
    - id: division_001
      name: 职业标准委员会
      function: 制定协理职业规范、继续教育要求和能力相关现场安全指引。
    - id: division_002
      name: 案件协调部
      function: 承接跨机构项目转介、协调复杂委托并维护合作机构名录。
    - id: division_003
      name: 伦理与申诉办公室
      function: 处理协理执业投诉、利益冲突与行业内部申诉。
  member_profile:
    typical_roles:
    - 协理人
    - 调解员
    - 调查助理
    - 行业培训师
    - 前律师
    - 安全顾问
    recruitment:
      description: 主要吸纳持有协理执业资格的从业者、事务所负责人，以及具有法律、保险、教育、医疗、安全等跨领域经验的专业顾问。
    culture:
      description: 强调记录、责任边界和可复盘性；成员之间常对标准化程度争论激烈，但普遍反感只凭能力类型给当事人贴标签。
  relationship:
    faction_002:
      status: cooperative
      description: 联合会需要研究中心提供能力与回写效应方面的专业意见，同时要求研究结论能被转化为可执行且可申诉的实务规范。
    faction_003:
      status: tense
      description: 双方在事故调查、理赔和风险评估上频繁合作，但联合会常质疑衡信过度依赖评级模型替代个案判断。
    faction_004:
      status: cooperative
      description: 联合会经常参与演出、艺人合同和公众能力使用争议；双方合作稳定，但会因舆论先行而产生摩擦。
    faction_005:
      status: cooperative
      description: 公共安全事件常需要协理人在行政处置结束后继续协调当事人、场地方、保险与社区关系。
    faction_006:
      status: cooperative
      description: 南栈的小店、居民和自由职业者是协理服务的重要使用者，合作集中在租赁、活动、保险与邻里纠纷。
  knowledge_boundary:
    rules_source: data/knowledge/knowledge_rules.yaml
    public_information:
    - lore_id: lore_001
      summary: 临洲存在合法的协理职业，协理人主要承担跨机构协调、事实整理和民事争议处理。
    - lore_id: lore_002
      summary: 协理联合会负责行业培训、职业规范和部分公共项目转介，但不拥有警察或行政机关的强制权。
    member_information:
    - lore_id: lore_003
      summary: 联合会近年将能力评级争议和回写效应相关委托列为高增长案件类型，并正在调整培训内容。
    - lore_id: lore_004
      summary: 联合会内部要求涉及多机构数据的案件必须记录信息来源、授权范围与可访问人员。
    restricted_information:
    - lore_id: lore_005
      summary: 联合会正在汇总一批跨行业案例，用于证明单一能力评级在长期个案中存在系统性偏差。
      access_requirement:
      - 案件协调部相关项目成员
      - 职业标准委员会相关负责人
    secret_information: []
  rumors:
  - id: rumor_001
    content: 有人说资深协理人可以绕过警方程序直接调取任何机构的内部资料。
    truth_status: false
    known_by:
    - public
  story_functions:
  - 作为主角持续获得委托与跨圈层案件入口的制度基础
  - 承载职业伦理、责任边界和调解失败等实务冲突
  - 连接学校、企业、公共部门和社区的跨机构剧情
  character_archetypes:
  - 刚取得执业资格的年轻协理人
  - 重视程序与证据的资深调解员
  - 从律师或保险行业转入协理工作的专业顾问
  - 擅长现场判断但不喜欢行政文书的自由协理人
  canon_constraints:
  - 该组织是行业联合组织，不是秘密侦探组织或政府情报机关。
  - 联合会不拥有超越警察、法院或行政机关的强制权限。
  - 成员不能因为协理身份自动读取其他机构的私密数据。
  - 联合会可以反对粗暴标准化，但不能否定一切能力测评和专业认证。
  - 组织剧情应以跨机构责任、调解和实务冲突为主，而非隐藏世界真相。
  tags:
  - 协理
  - 调解
  - 跨机构
  - 职业规范
  - 第三方
- id: faction_002
  name: 临洲大学行为与能力研究中心
  short_name: 临大能力中心
  type: academic
  status: active
  headquarters:
    city: 临洲市
    district: 槐庭区
    description: 位于临洲大学主校区内，实验室、访谈室、数据分析组和附属医疗合作空间分布在多个教学研究楼中。
  public_identity:
    description: 研究个体偏置形成、能力训练、认知变化与回写效应的跨学科研究中心，承担教学、公共科普和行业合作项目。
  public_reputation:
    description: 公众普遍认为该中心专业、谨慎但有些理想主义；部分人担心研究成果会被企业或学校拿去强化能力标签。
    keywords:
    - 学术
    - 实证
    - 回写研究
    - 研究伦理
  core_function:
    description: 通过可验证研究解释偏置与回写效应，为教育、医疗、行业标准和公共政策提供证据基础。
  ideology:
    principles:
    - 能力现象应当被研究，而不是被神秘化。
    - 可重复、可审查的证据优先于轶闻和恐慌。
    - 研究价值不能凌驾于知情同意、隐私和受试者权益。
  stance_on_main_conflict:
    summary: 认为回写效应必须持续研究，支持改进测评而非全面废止；主张明确区分描述性模型和决定个人命运的规范性判断。
    supports:
    - 长期追踪与可复核研究
    - 测评模型公开其适用边界
    - 研究伦理审查与数据最小化
    opposes:
    - 因恐惧而停止对回写效应的研究
    - 把相关性直接当作个人命运预测
    - 未经同意将研究数据用于招聘、保险或商业标签
  actual_goal:
    description: 建立一套能够区分自我认知、群体认知与环境因素影响的回写效应研究框架，并推动社会采用更谨慎的动态测评标准。
    visibility: internal
  internal_structure:
    description: 研究中心由多学科团队组成，项目制明显，实验数据与临床合作数据按伦理等级隔离。
    divisions:
    - id: division_004
      name: 偏置机制组
      function: 研究能力规则形成、稳定和变化机制。
    - id: division_005
      name: 回写与社会认知组
      function: 研究群体期待、标签与长期社会环境对偏置的影响。
    - id: division_006
      name: 研究伦理与数据办公室
      function: 负责受试者保护、数据权限、伦理审查和外部合作合规。
  member_profile:
    typical_roles:
    - 教授
    - 研究员
    - 博士生
    - 研究助理
    - 心理学家
    - 医疗合作人员
    - 学生志愿者
    recruitment:
      description: 通过大学教职、研究岗位、研究生培养和项目合作吸纳人员；核心岗位重视科研训练与伦理记录。
    culture:
      description: 重证据、重同行质疑，内部对研究结论的社会应用常有激烈争论；年轻研究者更关注标签伤害，高年资成员更强调样本与长期数据。
  relationship:
    faction_001:
      status: cooperative
      description: 研究中心为协理行业提供专业咨询和培训材料，也从真实案例中获得经授权的研究问题与观察数据。
    faction_003:
      status: cooperative
      description: 衡信提供部分匿名化风险数据和研究经费，但双方持续争论商业模型是否超出研究结论的适用范围。
    faction_004:
      status: tense
      description: 中心需要媒体进行科普，但反感将初步研究结论包装成确定性的人格或能力标签。
    faction_005:
      status: cooperative
      description: 双方在事故分析、活动安全和能力过度使用风险方面共享经过合规处理的研究成果。
    faction_006:
      status: cooperative
      description: 研究中心在南栈开展社区讲座与自愿研究项目，合作良好，但居民对数据用途保持敏感。
  knowledge_boundary:
    rules_source: data/knowledge/knowledge_rules.yaml
    public_information:
    - lore_id: lore_006
      summary: 临大能力中心公开研究偏置、能力训练和回写效应，并定期发布科普报告。
    - lore_id: lore_007
      summary: 回写效应已被学界视为值得持续研究的真实现象，但具体强度、条件和长期影响仍存在争议。
    - lore_id: lore_033
      summary: 回写效应的具体强度、条件和长期影响仍存在争议，相关研究仍在持续。
    member_information:
    - lore_id: lore_008
      summary: 中心内部普遍认为单次能力测评不足以预测个体长期变化，纵向数据比静态评级更重要。
    - lore_id: lore_009
      summary: 外部合作项目必须经过伦理和数据用途审查，不同课题组不能默认读取彼此的受限数据。
    restricted_information:
    - lore_id: lore_010
      summary: 部分长期样本显示，持续且一致的群体认知可能在个体主观认同尚未明显变化前，就与偏置表现变化出现相关。
      access_requirement:
      - 回写与社会认知组相关研究员
      - 研究伦理授权人员
    - lore_id: lore_011
      summary: 中心正在复核一批可能被商业能力模型错误解释的历史数据，尚未形成可公开结论。
      access_requirement:
      - 项目负责人
      - 数据办公室授权成员
    secret_information:
    - lore_id: lore_secret_001
      summary: 极少数核心研究者认为现有模型可能系统性低估群体认知对偏置形成的早期影响，但证据尚不足以公开主张。
      access_requirement:
      - 中心主任
      - 相关首席研究员
      - 研究伦理负责人
  rumors:
  - id: rumor_002
    content: 网上有人声称临大能力中心能通过一次测试准确预测一个人未来会发展成什么能力。
    truth_status: false
    known_by:
    - public
  story_functions:
  - 承载能力机制、回写效应和研究伦理相关主线信息
  - 产生校园、科研、受试者与数据使用争议
  - 为主角提供需要理解而不是单纯击败的复杂事实
  character_archetypes:
  - 坚持研究伦理的年轻研究员
  - 对社会应用过于乐观的博士生
  - 善于把复杂研究讲给普通人听的教授
  - 曾作为长期研究参与者、如今质疑研究标签的学生
  canon_constraints:
  - 研究中心不是疯狂人体实验机构，也不秘密拘禁能力者。
  - 所有高风险研究必须存在知情同意、伦理审查或其缺失所带来的明确违规后果。
  - 研究人员不能凭一项研究就确定某个人未来的能力或人格。
  - 普通学生和普通研究助理不会自动知道受限项目数据。
  - 研究争议应围绕证据、伦理和社会应用边界，而不是神秘超自然真相。
  tags:
  - 大学
  - 研究
  - 偏置
  - 回写效应
  - 伦理
  - 数据
- id: faction_003
  name: 衡信保险
  short_name: 衡信
  type: corporation
  status: active
  headquarters:
    city: 临洲市
    district: 中央湾
    description: 总部位于中央湾金融商务区，在东港带、新河区和主要住宅区设有理赔与企业风险服务网点。
  public_identity:
    description: 提供个人、企业、活动与能力责任相关保险产品的大型综合保险公司，并向企业客户提供风险评估服务。
  public_reputation:
    description: 以数据能力强、理赔流程严谨著称；客户认为它可靠但不够有人情味，能力评级相关产品长期受到隐私与公平性质疑。
    keywords:
    - 保险
    - 风险
    - 精算
    - 标准化
    - 数据
  core_function:
    description: 把能力相关事故与不确定性转化为可定价、可分担和可追责的风险，从而维持商业活动和个人责任体系的可运行性。
  ideology:
    principles:
    - 无法测量的风险无法被公平分担。
    - 模型应服务于风险决策，但必须持续校准。
    - 保险的目标不是判断一个人好坏，而是估计具体场景中的损失概率。
  stance_on_main_conflict:
    summary: 支持能力评级和动态风险模型，认为完全放弃标准化会把成本转嫁给所有投保人；同时逐步接受模型必须提供复核和纠错通道。
    supports:
    - 动态风险评估
    - 用途明确的数据授权
    - 基于事故记录和环境因素的模型更新
    opposes:
    - 完全禁止能力相关风险定价
    - 把保险模型公开误读为人格或犯罪预测
    - 在缺乏证据时无限扩大责任范围
  actual_goal:
    description: 建立临洲最可靠的动态能力风险模型，降低高波动赔付并保持市场领先，同时减少因模型歧视争议导致的监管和声誉成本。
    visibility: internal
  internal_structure:
    description: 业务以产品、理赔和企业风险服务为核心，数据与合规部门对能力相关模型拥有较高影响力。
    divisions:
    - id: division_007
      name: 能力风险精算部
      function: 设计和维护能力责任、职业与活动风险模型。
    - id: division_008
      name: 特殊理赔调查部
      function: 处理责任边界复杂、涉及多方能力使用的理赔案件。
    - id: division_009
      name: 模型治理与合规部
      function: 审查模型用途、偏差、数据授权与监管风险。
  member_profile:
    typical_roles:
    - 精算师
    - 理赔员
    - 调查员
    - 数据分析师
    - 企业风险顾问
    - 法务
    - 合规经理
    recruitment:
      description: 大量吸纳金融、统计、法律、调查和行业风险背景人才；涉及能力评估的岗位通常需要额外专业认证。
    culture:
      description: 强数据导向、强调证据链和成本控制；内部并非铁板一块，业务部门、模型团队与合规部门经常围绕效率和公平发生冲突。
  relationship:
    faction_001:
      status: tense
      description: 衡信依赖协理人处理复杂现场和第三方协调，但认为部分协理人过于依赖个案经验、低估大样本风险模型。
    faction_002:
      status: cooperative
      description: 公司与研究中心存在数据和课题合作，同时接受其对模型外推和数据用途的严格质疑。
    faction_004:
      status: cooperative
      description: 衡信承保大量演出、艺人和商业活动，也会与霓桥共同处理舆论放大的责任事件。
    faction_005:
      status: cooperative
      description: 公共安全事故记录和行业安全标准是保险定价的重要依据，但数据共享必须遵守法定边界。
    faction_006:
      status: tense
      description: 南栈商户认为部分能力风险评级抬高了小经营者成本，衡信则认为取消差异化定价会让风险被全体客户承担。
  knowledge_boundary:
    rules_source: data/knowledge/knowledge_rules.yaml
    public_information:
    - lore_id: lore_012
      summary: 衡信销售能力责任相关保险，并公开声明不会把单一能力类型直接等同于个人危险性。
    - lore_id: lore_013
      summary: 衡信使用事故记录、职业场景和能力使用特征进行风险评估，其方法受到监管与社会监督。
    member_information:
    - lore_id: lore_014
      summary: 公司近年正在把静态能力评级逐步改造成动态风险模型，增加环境、训练和历史行为等变量。
    - lore_id: lore_015
