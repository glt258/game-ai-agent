    type: final_state
    expected_current_node_id: node_slice_complete
    expected_active_cases: [case_nanzhan_postshow_coordination_001]
    expected_active_incidents: [incident_nanzhan_postshow_route_conflict_001]
    expected_flags: {joint_facts_confirmed: true, vertical_slice_complete: true}
  - id: tang_case_context
    type: context
    character_id: char_launch_001
    expected_active_cases: [case_nanzhan_postshow_coordination_001]
    expected_active_incidents: []
  - id: ji_incident_context
    type: context
    character_id: char_launch_007
    expected_active_cases: []
    expected_active_incidents: [incident_nanzhan_postshow_route_conflict_001]
  - id: yu_witness_no_context
    type: context
    character_id: char_launch_004
    expected_active_cases: []
    expected_active_incidents: []
  - id: lumi_unrelated_no_context
    type: context
    character_id: char_launch_002
    expected_active_cases: []
    expected_active_incidents: []
  - id: lumi_public_allow
    type: knowledge
    character_id: char_launch_002
    lore_id: lore_018
    expected_decision: allow
  - id: ren_secret_deny
    type: knowledge
    character_id: char_launch_006
    lore_id: lore_secret_002
    expected_decision: deny
  - id: ji_incident_does_not_bypass_subject
    type: knowledge
    character_id: char_launch_007
