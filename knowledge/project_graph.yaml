    title: "Engineering Knowledge Snapshot Boundary"
    status: "frozen"
    decision: "Engineering Knowledge Graph v0.1 represents an explicitly identified snapshot. A dirty working tree must never be silently represented as the tagged release."
    rationale: "HEAD is tagged v0.8 while the current working tree contains reviewed but uncommitted W4, Web, benchmark and documentation changes."
    consequences:
