architecture_decisions:
  - id: "ADR-001"
    title: "Engineering Knowledge Snapshot Boundary"
    status: "frozen"
    decision: "Engineering Knowledge Graph v0.1 represents an explicitly identified snapshot. A dirty working tree must never be silently represented as the tagged release."
    rationale: "HEAD is tagged v0.8 while the current working tree contains reviewed but uncommitted W4, Web, benchmark and documentation changes."
    consequences:
      - "Graph metadata records branch, HEAD, release tag when applicable, working-tree state and snapshot kind."
      - "Query emits a warning when the graph snapshot differs from the current Git state."
      - "Experimental working-tree components remain distinct from released architecture."
    evidence:
      - path: "docs/decisions/ADR-001-engineering-knowledge-snapshot-boundary.md"
        locator: "decision and consequences"
