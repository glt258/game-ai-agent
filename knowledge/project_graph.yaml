constraints:
  - id: "constraint.combat_role_canonical_ownership"
    statement: "src/combat_semantics/roles.py is the sole canonical combat-role definition source; legacy taxonomy and compatibility adapters must not become parallel canonical owners."
    severity: "high"
    scope:
      - "component.combat_role_profile"
      - "concept.canonical_combat_roles"
    evidence:
      - path: "tests/test_combat_role_compatibility_freeze_b15.py"
        locator: "canonical role and compatibility boundary"

  - id: "constraint.reference_corpus_not_canon"
    statement: "Reference Corpus is not Project Canon and cannot authorize Canon claims."
    severity: "high"
    scope:
      - "component.reference_corpus"
      - "dataset_boundary.reference_corpus_manifest"
    evidence:
      - path: "src/agents/official_character_authoring.py"
        locator: "project Canon comes from authoring tools and CanonChecker"

  - id: "constraint.character_generation_reviewable"
    statement: "Character generation creates reviewable drafts and does not directly mutate Canon."
    severity: "high"
    scope:
      - "component.character_generation_agent"
      - "contract.character_draft"
    evidence:
      - path: "docs/runtime_freeze_v0.6.6.md"
        locator: "Draft != Canon and no automatic writes"

  - id: "constraint.canon_checker_deterministic"
    statement: "CanonChecker remains deterministic, read-only and does not call an LLM."
    severity: "high"
    scope:
      - "component.canon_checker"
    evidence:
      - path: "src/agents/canon_checker.py"
        locator: "module contract and check method"

  - id: "constraint.skill_semantics_before_compilation"
    statement: "Skill semantics are produced before deterministic representation compilation; LLM output must not directly become canonical SkillKit representation."
    severity: "high"
    scope:
      - "component.semantic_skill_ir"
      - "component.skillkit_compiler"
      - "component.canonical_skillkit"
    evidence:
      - path: "docs/character_generation/character_skill_design_v1_freeze_v1.0.md"
        locator: "LLM owns gameplay semantics; compiler owns representation mechanics"

  - id: "constraint.graph_references_boundaries"
    statement: "The Engineering Knowledge Graph references game Canon boundaries but does not duplicate game Canon records."
    severity: "high"
    scope:
      - "dataset_boundary.runtime_canon_data"
      - "component.reference_corpus"
    evidence:
      - path: "docs/knowledge_resolver_v0.2.md"
        locator: "Canon data source boundary"

  - id: "constraint.experimental_not_release"
    statement: "Experimental working-tree components must not be represented as released v0.8 architecture."
    severity: "high"
    scope:
      - "component.web_adapter"
      - "component.character_kit_session"
    evidence:
      - path: "docs/web/web_v0.1_architecture.md"
        locator: "older architecture snapshot"

  - id: "constraint.persistence_single_physical_store"
    statement: "SQLite is the only physical persistence store for the W4-S4 foundation; content-addressed artifact and Kit identity must not be interpreted as a filesystem CAS requirement."
    severity: "high"
    scope:
      - "component.persistence_foundation"
      - "component.skill_artifact_persistence"
      - "component.character_skill_persistence"
    evidence:
      - path: "docs/persistence_foundation_v0.1.md"
        locator: "single SQLite store and no filesystem CAS"

  - id: "constraint.persistence_derived_runtime_state"
    statement: "Freshness, Artifact compatibility and CharacterKit structural validation are runtime-derived and must not be treated as persisted authority."
    severity: "high"
    scope:
      - "component.character_skill_persistence"
      - "component.character_kit_persistence"
      - "contract.character_skill_design_context"
      - "contract.character_kit"
    evidence:
      - path: "docs/character_skill_kit_persistence_contract_v0.1.md"
        locator: "derived freshness, compatibility and structural validation boundary"

  - id: "constraint.historical_skill_reports_not_persisted"
    statement: "W4-S4 persistence stores Binding Alignment snapshots but does not implement generalized historical Evaluation, Alignment or Role Coverage report repositories; those belong to W4-S4D."
    severity: "high"
    scope:
      - "component.character_skill_persistence"
      - "component.character_kit_persistence"
      - "contract.character_skill_alignment"
    evidence:
      - path: "docs/character_skill_kit_persistence_contract_v0.1.md"
        locator: "historical report repositories are out of scope"

  - id: "constraint.live_jobs_ephemeral"
    statement: "LiveExecutionJob is process-local, session-oriented and TTL-bounded; live jobs are not persisted, and only formal domain artifacts may enter the persistence boundary."
    severity: "high"
    scope:
      - "component.live_execution_job"
      - "component.web_adapter"
    evidence:
      - path: "docs/live_web_execution_contract_v0.1.md"
        locator: "live job lifecycle and non-persistence boundary"

  - id: "constraint.committed_content_verification"
    statement: "A local green test result from a dirty working tree is insufficient evidence for a checkpoint, release, or main push; verification must execute from committed content in a temporary clean checkout."
    severity: "high"
    scope:
      - "component.persistence_foundation"
      - "component.character_persistence"
      - "component.character_skill_persistence"
      - "component.character_kit_persistence"
    evidence:
      - path: "docs/ci_clean_checkout_verification.md"
        locator: "clean-checkout verification procedure"

