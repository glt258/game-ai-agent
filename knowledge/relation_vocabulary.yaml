schema_version: "engineering-knowledge-relations/0.1"
relations:
  - id: "owns"
    direction: "from owns to"
    meaning: "From defines or maintains the engineering meaning of To."
  - id: "canonical_for"
    direction: "from is canonical for to"
    meaning: "From is the canonical source for the concept represented by To."
  - id: "implements"
    direction: "from implements to"
    meaning: "From implements the contract or interface represented by To."
  - id: "depends_on"
    direction: "from depends on to"
    meaning: "From relies on To for execution or validation."
  - id: "consumes"
    direction: "from consumes to"
    meaning: "From reads or uses the artifact, contract or boundary To."
  - id: "produces"
    direction: "from produces to"
    meaning: "From creates the artifact or result To."
  - id: "validates"
    direction: "from validates to"
    meaning: "From checks the validity of To."
  - id: "evaluates"
    direction: "from evaluates to"
    meaning: "From determines quality or status for To."
  - id: "repairs"
    direction: "from repairs to"
    meaning: "From performs an explicitly bounded repair of To."
  - id: "compiles"
    direction: "from compiles to"
    meaning: "From deterministically transforms To into another representation."
  - id: "retrieves_from"
    direction: "from retrieves from to"
    meaning: "From obtains bounded information from To."
  - id: "configured_by"
    direction: "from configured by to"
    meaning: "From receives operational configuration from To."
  - id: "exposes"
    direction: "from exposes to"
    meaning: "From makes To available across an API or boundary."
  - id: "adapts"
    direction: "from adapts to"
    meaning: "From adapts an existing component or contract To."
  - id: "tested_by"
    direction: "from tested by to"
    meaning: "From is directly tested by To."
  - id: "protected_by"
    direction: "from protected by to"
    meaning: "From's explicit contract is protected by To."
  - id: "benchmarked_by"
    direction: "from benchmarked by to"
    meaning: "From is measured by To."
  - id: "supersedes"
    direction: "from supersedes to"
    meaning: "From replaces an older engineering source To."
  - id: "deprecated_by"
    direction: "from deprecated by to"
    meaning: "From is marked as deprecated by To."
