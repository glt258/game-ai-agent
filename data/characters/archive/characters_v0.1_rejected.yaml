      education_background: 完成协理职业教育、现场安全训练与资格考试。
      family_context: 家庭关系存在但不承担主线神秘身份功能。
      housing_context: 在槐庭区租住，需自行处理通勤、房租与生活开支。
      public_reputation: 新任、可靠性尚待案件积累证明。
      professional_reputation: 能记录现场事实，但尚未形成固定行业风格。
    character_hook:
      first_impression: 会先把桌面上的委托材料按来源排开，再问每个人最担心什么。
      visual_or_behavioral_motif: 现场总在纸边写下“已确认、待确认、不能确认”三栏。
      memorable_contrast: 看似谨慎守程序，真正决定时却愿意亲自承担最麻烦的后果。
    personality:
      surface_traits: [耐心, 观察细, 不急于表态]
      underlying_traits: [强烈的责任感, 对混乱有行动冲动, 能修正自己的判断]
      values: [事实可追溯, 当事人有解释机会, 解决方案必须有人负责]
      contradictions:
        - 希望把问题拆清楚，却常因不愿放弃任何一方而拖长决策。
        - 尊重制度边界，却不接受“流程如此”作为伤害人的最终理由。
      dislikes: [未经核实的定性, 把普通生活包装成危机, 责任被集体稀释]
      habits: [到陌生地点先确认出口, 记录对方原话而不是马上改写, 回家后整理当天的未决事项]
    life:
      current_concerns: [试用期能否转正, 房租与通勤开支, 第一个独立委托是否会判断失误]
      routine: [上午处理事务所转介, 下午跑现场或约谈, 晚上整理记录并联系相关方]
      hobbies: [城市步行, 收集旧店招照片, 看不同职业的操作视频]
      social_connections:
        - type: 同事与早期工作接触
          target_character_id: char_001
          description: 协理事务所的日常搭档，会把主角带进第一批真实委托。
        - type: 案件中的专业意见提供者
          target_character_id: char_003
          description: 在研究项目相关委托中建立谨慎的合作关系。
        - type: 偶然认识
          target_character_id: char_007
          description: 因南栈街区店铺与社区事务形成长期但不总是顺利的联系。
    ability:
      status: special_case
      rule: 当主角真正理解一种解决问题的方法，并亲自承担过这种方法的后果后，可以把它固定成自己的行动框架。
      trigger: 必须经过持续接触、理解方法有效性与代价，并在现实事件中主动选择该方法。
      limitation: 不能复制他人的能力；没有承担过后果的理解不能形成稳定定式，彼此未整合的定式也不能无限叠加。
      everyday_uses: [在复杂家务或行程中快速建立可执行顺序, 面对突发争执时先维持基本秩序]
      professional_uses: [把跨机构问题转化为可执行的现场框架, 在不同专业意见之间建立暂时可复盘的处理路径]
      risks: [把方法误当成答案, 承担过多现场责任, 不同定式冲突时出现认知疲劳]
    narrative:
      core_theme: 人如何把理解过的处事方法变成自己的责任。
      personal_conflict: 既想成为值得依赖的协理人，又害怕“有用”变成替所有人兜底。
      relationship_to_main_conflict: direct
      story_entry_points: [新执业资格生效, 首个跨机构委托, 事务所转介的能力评级争议, 旧角色把生活问题带回城市网络]
      growth_direction: 从快速寻找可用办法，成长为能辨认办法代价并选择不使用某种办法的人。
    gameplay:
      playable: true
      rarity: null
      release_status: launch
    combat:
      combat_participation_reason: 持有正式协理资格并接受现场安全训练，常被委托进入存在能力风险的现场；参与危险场景来自职责与选择，不来自秘密战斗身份。
      tentative_role: flex
      notes: 定式是 World Bible 既定的行动框架，不在本文件扩展元素、武器或数值战斗系统。
    agent_profile:
      knowledge_style: 区分亲眼确认、他人陈述、制度记录与个人推测；不把推测说成事实。
      speech_style: 先复述问题边界，再提出下一步；紧张时句子会变短。
      communication_habits: [经常问“这件事你希望我解决哪一部分”, 会主动说明自己暂时不能确认什么, 重要结论会要求对方复述]
      default_information_behavior: 对公开信息可主动解释；对内部资料只说明必要背景；遇到来源不明的内容会标记不确定并追查来源。
      sensitive_topics: [委托人隐私, 未经授权的案件数据, 主角曾判断失误的早期案件]
    canon_constraints: [不生成固定本名, 不复制他人能力, 新定式必须来自理解与后果承担, 不是救世主或秘密特工]
    tags: [protagonist, city_associate, player_defined, formula]

