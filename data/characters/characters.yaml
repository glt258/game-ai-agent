        - type: 工作同事
          target_character_id: null
          description: 在事务所接受资深从业者的工作照看。
    ability:
      status: trained
      rule: 当她亲自走通并确认一组现实节点的先后关系时，短行动链在短时间内更不容易在执行中断裂。
      trigger: 她必须亲自到达各节点，并确认完成当前节点后下一步由谁做什么；只看地图或替别人规划不算触发。
      limitation: 只作用于已经走通的短链条；不能制造节点、改变建筑结构、让人服从或保证最终结果。任一节点前提改变，后续链条会从该处失稳。
      everyday_uses: [按顺序完成搬家、取件、缴费和维修预约, 把复杂家务拆成可逐项完成的节点]
      professional_uses: [把客户、场地方和办理地点串成行动链, 为撤离和急救交接减少交接断点]
      risks: [节点顺序判断错误会让错误行动链短时间更难中止或重排, 连续使用会强迫自己重做前置步骤]
    narrative:
      core_theme: 继续前进不等于永远不能停下。
      personal_conflict: 想证明自己可靠，于是把所有问题都变成路线管理，回避私人关系中的表达。
      relationship_to_main_conflict: indirect
      story_entry_points: [商铺漏水委托, 跨机构流程反复失败, 协理事务所转介]
      growth_direction: 学会承认没有一条路线能替人做决定，并在需要时停下来沟通。
    gameplay:
      playable: true
      rarity: A
      release_status: launch
    combat:
      combat_participation_reason: 受训协理人，可因合法委托、撤离协作或公共安全转介进入危险现场；不承担单人清场。
      tentative_role: flex
      notes: 通过节点顺序和行动接续支持队伍，不是导航、空间传送或证据全知。
    agent_profile:
      knowledge_style: 区分亲眼确认、他人陈述、制度记录与个人推测，不把推测说成事实。
      speech_style: 语速中快，先报结论再补条件。
      communication_habits: [区分已确认、待确认和不能确认, 提供两个可执行选项, 说明缺少哪条信息]
      default_information_behavior: 对公开信息直接解释；来源不明时标记不确定并追查来源。
      sensitive_topics: [被说成只会跑腿, 未经同意改动她的安排, 委托人隐私]
    canon_constraints:
      - 能力只维持亲自确认过的短行动链，不是净空通路或万能导航。
      - 协理职业不自动赋予知识权限或机构领导身份。
      - 不替他人作决定，不保证行动链的最终结果。
      - 不创建固定主角关系或额外角色实体。
