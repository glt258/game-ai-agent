  abilities:
    - ability_id: normal_attack
      native_name: "Akara"
      native_category: "Normal Attack"
      normalized_category: null
      description_summary: "Performs up to four consecutive attacks dealing Dendro DMG. The Charged Attack consumes Stamina and, after a short casting time, deals AoE Dendro DMG to opponents in front of her; the Plunging Attack deals AoE Dendro DMG upon impact with the ground."
    - ability_id: elemental_skill
      native_name: "All Schemes to Know"
      native_category: "Elemental Skill"
      normalized_category: null
      description_summary: "Press deals AoE Dendro DMG around Nahida and applies the Seed of Skandha to up to 8 opponents hit. Hold enters an Aiming Mode lasting up to 5s that selects up to 8 opponents within a limited area while increasing Nahida's resistance to interruption; on release it deals Dendro DMG to the selected opponents and applies the Seed of Skandha to them. Opponents marked by the Seed of Skandha are linked to one another within a certain distance; when a marked opponent is affected by an Elemental Reaction or takes Dendro Core DMG (including Hyperbloom and Burgeon), Nahida unleashes Tri-Karma Purification on that opponent and all opponents linked to it, dealing Dendro DMG based on her ATK and Elemental Mastery, at most once every 2.5s. The Seed of Skandha lasts 25s; Press and Hold cooldowns are 5s and 6s respectively."
    - ability_id: elemental_burst
      native_name: "Illusory Heart"
      native_category: "Elemental Burst"
      normalized_category: null
      description_summary: "Manifests the Court of Dreams and expands the Shrine of Maya domain (15s base duration). While Nahida remains within the Shrine, the domain grants effects based on the Elemental Types present in the party: Pyro party members increase the DMG dealt by Tri-Karma Purification, Electro party members decrease the interval between Tri-Karma Purification triggers, and Hydro party members extend the Shrine's duration; when at least 2 party members share one of these Elemental Types, the corresponding effect is further enhanced. Nahida retains these bonuses while off-field as long as the party remains within the Shrine."
    - ability_id: passive_compassion_illuminated
      native_name: "Compassion Illuminated"
      native_category: "1st Ascension Passive"
      normalized_category: null
      description_summary: "When Illusory Heart is unleashed, the Shrine of Maya gains an additional effect: the Elemental Mastery of the active character within the field is increased by 25% of the Elemental Mastery of the party member with the highest Elemental Mastery, up to a maximum of 250 Elemental Mastery."
    - ability_id: passive_awakening_elucidated
      native_name: "Awakening Elucidated"
      native_category: "4th Ascension Passive"
      normalized_category: null
      description_summary: "Each point of Nahida's Elemental Mastery beyond 200 increases the DMG dealt by Tri-Karma Purification by 0.1% and its CRIT Rate by 0.03%, up to a maximum of 80% Bonus DMG and 24% CRIT Rate."
    - ability_id: passive_on_all_things_meditated
      native_name: "On All Things Meditated"
      native_category: "Utility Passive"
      normalized_category: null
      description_summary: "Nahida can use the Elemental Skill All Schemes to Know to interact with certain harvestable items within a certain range in the open world."
