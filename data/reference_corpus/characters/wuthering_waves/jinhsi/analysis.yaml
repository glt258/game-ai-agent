combat_design:
  normalized_roles:
    - "on_field_dps"
  attack_range: "melee"
  field_time: "high"
  mechanical_complexity: "high"
  execution_difficulty: "medium"
  mobility: "medium"
  survivability: "low"
  team_dependency: "high"
  primary_loop:
    summary: >-
      The loop is a staged enhanced-state cycle driven by the mechanic
      graph: the player enters an airborne enhanced state via a
      gated alternative skill, advances the state machine through a
      mid-air attack sequence, unlocks a state-gated empowered skill,
      spends team-generated Incandescence on its amplified payoff,
      and hands off to the team so their qualifying damage regenerates
      the resource before the next re-entry into the enhanced state.
    steps:
      - "enter_enhanced_state"
      - "advance_state_sequence"
      - "unlock_empowered_skill"
      - "spend_team_fed_resource"
      - "grant_handoff_state"
      - "swap_to_regenerate_resource"
      - "rebuild_and_reenter"
  resource_loop: >-
    Incandescence is a genuine build-store-spend-payoff loop. It is
    generated by qualifying Attribute damage and Coordinated Attacks
    from Resonators under Eras in Unity (the team channel, amplified
    for 20 seconds by the Outro Skill Temporal Bender, which makes
    same-Attribute damage grant Incandescence at a one-second
    interval), stored up to a cap of 50, and consumed by Illuminous
    Epiphany while Ordination Glow lasts for additional damage, which
    is the empowered payoff before Unison is granted.
  burst_pattern: >-
    Purge of Light is an independent burst damage node parallel to the
    Incandescence/state loop: it deals Spectro damage and can be cast
    mid-air, but no mechanic relation connects it to Incandescence,
    Incarnation, Ordination Glow, or Unison. It neither spends the
    resource nor advances the state machine.
  archetypes:
    - "state_progression_attacker"
    - "team_fed_resource_carrier"
    - "empowered_skill_attacker"
  core_mechanics:
    - "team_driven_resource_generation"
    - "multi_stage_state_progression"
    - "state_gated_empowered_skill"
    - "resource_amplified_skill_payoff"
    - "aerial_attack_state"
character_design:
  character_fantasy: >-
    Playing Jinhsi is a staged, airborne combat experience: the player
    enters a luminous enhanced state, completes a mid-air attack
    sequence that advances the state machine, unlocks a glowing
    empowered skill, and releases the light the team has fed into her
    (Incandescence) in a single amplified detonation before handing
    off and cycling back — a fantasy of composed aerial ceremony and
    team-fed climax rather than raw self-sufficient aggression.
