  identity_hooks:
    - "magistrate_of_jinzhou"
    - "governing_official_of_city_state"
  narrative_hooks:
    - "governing_official_with_personal_combat_presence"
  visual_motifs: []
  authoring_features:
    personality: [restrained, idealistic, socially_embedded]
    gameplay_fantasy: [direct_frontline_pressure, setup_payoff]
    life_social_identity: [formal_professional]
    life_stage: []
    authority: [formal_leadership]
    hook:
      surface_traits: [formal_role_identity]
      contrast_traits: [formal_role_personal_action]
      behavioral_patterns: [restraint_for_payoff]
    visual_behavioral_motifs: [signature_object]
    evidence:
      personality:
        - {kind: source_fact, source_id: official-introduction, fact_path: narrative}
        - {kind: analyst_derivation, note: "Composure is treated as a public-leadership instrument, idealism as the civic role's value orientation, and social embeddedness as Jinzhou institutional belonging."}
      gameplay_fantasy:
        - {kind: source_fact, source_id: official-developer-notes-jinhsi, fact_path: combat}
        - {kind: analyst_derivation, note: "The staged enhanced state, team-fed Incandescence, empowered skill, and handoff support setup_payoff alongside direct frontline pressure."}
      life_social_identity:
        - {kind: source_fact, source_id: official-introduction, fact_path: narrative}
        - {kind: analyst_derivation, note: "Magistrate of Jinzhou is normalized as a formal professional identity."}
      authority:
        - {kind: source_fact, source_id: official-introduction, fact_path: narrative}
        - {kind: analyst_derivation, note: "Formal leadership denotes real Magistrate/head-of-state institutional scope; it is not the small-agency leadership represented by Nicole."}
      hook.surface_traits:
        - {kind: source_fact, source_id: official-introduction, fact_path: narrative}
        - {kind: analyst_derivation, note: "The surface hook is the Magistrate's formal role identity."}
      hook.contrast_traits:
        - {kind: source_fact, source_id: official-introduction, fact_path: narrative}
        - {kind: source_fact, source_id: official-developer-notes-jinhsi, fact_path: combat}
        - {kind: analyst_derivation, note: "Formal role/personal action is a distinct governing-official precedent: institutional authority expressed through personal frontline action."}
      hook.behavioral_patterns:
        - {kind: source_fact, source_id: official-developer-notes-jinhsi, fact_path: combat}
        - {kind: analyst_derivation, note: "Restraint for payoff reflects the staged, composed combat cycle and public leadership instrument rather than a generic quiet trait."}
      visual_behavioral_motifs:
        - {kind: source_fact, source_id: official-developer-notes-jinhsi, fact_path: presentation.official_visual_tags}
        - {kind: analyst_derivation, note: "The source-backed Loong Scales feature is a concrete character-specific visual object and supports the signature_object motif without adding symbolic interpretation."}
  gameplay_identity_alignment:
    score: 0.5
    reasoning: >-
      The verified public identity is Magistrate of Jinzhou. The combat
      kit expresses a leader who channels contributions from those
      around her into a decisively staged, ceremonially delivered
      strike (team-fed resource, enhanced airborne state, empowered
      payoff), which reads as consistent with a magistrate fantasy of
      collective power focused into personal action; however, the
      facts contain no explicit design statement linking the identity
      and the combat language, and the narrative evidence is limited
      to occupation and affiliation, so the alignment is plausible but
      only moderately evidenced.
