  notes:
    - "Identity core facts (Mortefi, Fusion, 4-star, released in Version 1.0 on 2024-05-23, expert in Applied Tacetite Study at Huaxu Academy's Department of Safety, 'Dragon's Breath' Resonator) are directly supported by three official Kuro Games sources: the Profile Reveal (article 512, 2023-10-18), the Developer's Note (article 526, 2023-10-23), and the launch Convene notice (article 758, 2024-05-23). The Profile Reveal establishes the canonical name and epithet; the Developer's Note establishes the Tacet Mark, the weapon as pistols empowered with Tacetite energy, and the Annoyance concept (builds on hit, reaches maximum, triggers enhanced Resonance Skill, expends all Annoyance); the Convene notice binds Mortefi to the Version 1.0 launch as a 4-star Featured Resonator."
    - "The full live kit (ability names, Fury Fugue, Annoyance cap 100, Burning Rhapsody duration 10s, Marcato 1/2 triggers, 0.35s rate limit, Rage Transposition 38% / 14s, Harmonic Control 25% / 8s, Rhythmic Vibrato, Heavy Attack aiming) is supplied by two independent secondary sources — Wuthering Wiki (full EN in-game kit text) and Moegirlpedia (full CN in-game kit text) — that agree on every mechanic and number; per ingestion policy these secondary-only sub-facts keep the record at partially_verified. The CN native names of the two Inherent Skills could not be cross-checked (the Moegirlpedia page omits the Inherent Skill section), so only the official EN names are recorded."
    - "Burning Rhapsody representation: the coordinated-attack team effect has a party-scoped subject, so it is not a StateFact (subject_scope cannot honestly be self/target/unknown); it is modeled as a TeamInteractionFact + TeamMechanics buffs/off_field_effects, matching the Shorekeeper Stellarealm precedent. The active-teammate hit trigger that fires Mortefi's coordinated Marcato attacks is an external team event that cannot be expressed as a MechanicRef source node in Mortefi's own ability graph, so that trigger edge is recorded as graph friction rather than a relation."
    - "Marcato is not modeled as an independent AbilityFact. It has no independent entry point or activation; it appears only within the Burning Rhapsody interaction description, the off_field_effects prose, and the Rhythmic Vibrato description. Creating a Marcato node would introduce a graph node with no incoming relation edges, which is inconsistent with the frozen semantic decisions."
    - "The Heavy Attack aiming targeting mechanic (Charged Attack enters an aiming state for a precise shot) is included per the Human Decision to preserve the pistol weapon-type aiming behavior in the record."
