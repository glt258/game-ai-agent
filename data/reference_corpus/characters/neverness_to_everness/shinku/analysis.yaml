character_design:
  character_fantasy: >-
    Playing Shinku is an escalation-through-conversion experience: aggressive
    qualifying attacks build a personal gauge, the ultimate converts that
    gauge into a limited empowered attack mode that rewrites her basic
    attacks, and a patient stance rewards staying active without attacking by
    releasing a decisive strike on the next hit. The kit also routes the
    active character's Ultimate Energy gains to off-field allies, so the
    fantasy combines self-contained resource escalation with a
    restraint-for-payoff stance and a team energy conduit.
