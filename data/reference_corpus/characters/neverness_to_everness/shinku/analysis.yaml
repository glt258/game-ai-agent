  primary_loop:
    summary: >-
      The loop has two parallel mechanic channels. The main channel is a
      build-to-state cycle: Shinku's qualifying attacks (Special Combat Arts
      chain, the High-Speed Breach charge, and the Breaching Tactics knee
      strike) generate the character-specific Defiant Spirit gauge; the
      Crimson Fury ultimate consumes Defiant Spirit and enters the
      limited-duration Surging Crimson self-state, which replaces Special
      Combat Arts with Tidal Assault; after the state window the same
      qualifying attacks rebuild the gauge. A parallel stance channel is the
      Menacing Gaze self-state, which stacks while Shinku stays active
      without attacking and ends on a hit, triggering Instant Strike and
      granting combat resources (the target resource is not specified in the
      facts). Separately, Lone Stride provides Charge Enhancement: when the
      active character gains Ultimate Energy, off-field characters receive
      the same Charge, and Shinku gains ATK while she is the active character
      during Charge — an outgoing team utility that does not gate her
      personal loop.
    steps:
      - "accumulate_character_resource"
      - "spend_resource_to_enter_state"
      - "exploit_state_modified_attacks"
      - "rebuild_resource"
      - "hold_active_stance"
      - "release_stance_on_hit"
  resource_loop: >-
    Defiant Spirit is a genuine build-and-spend gauge: it accumulates from
    three of Shinku's own qualifying attacks and is consumed by the Crimson
    Fury ultimate to enter the Surging Crimson state. The facts do not record
    a numeric cap (cap is null), the consumption amount per use, or any
    depletion-to-exit rule, so the loop is documented as accumulation ->
    spend at the ultimate -> empowered state -> rebuild through the same
    qualifying attacks, without asserting a spend-to-empty reset or a
    threshold condition.
  burst_pattern: >-
    The Crimson Fury ultimate is the burst node: it consumes Defiant Spirit
    and launches multiple attacks while entering Surging Crimson, so the
    burst is delivered at the resource-to-state conversion point and
    continues through the state-modified attack window (Tidal Assault).
    There is no evidence of the burst acting as a cycle-closing finisher or
    as a separate resource reset.
