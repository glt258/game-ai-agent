combat_design:
  normalized_roles:
    - "on_field_dps"
  attack_range: "melee"
  field_time: "high"
  mechanical_complexity: "high"
  execution_difficulty: "medium"
  mobility: "medium"
  survivability: "low"
  team_dependency: "low"
  primary_loop:
    summary: >-
      The loop is a self-contained escalation cycle driven by the mechanic
      graph: qualifying on-field actions (Basic Attack, a qualifying Perfect
      Dodge, or a qualifying Defensive Assist) accumulate Passion Stream;
      reaching its maximum enters the Passion empowered state, which
      increases Anomaly Buildup Rate and ATK and enhances some Basic and
      Special Attacks (which can also consume or restore Passion Stream
      while Passion is active); throughout, the Core Passive Insight applies
      Gnawed to enemies, so Assaults against a Gnawed enemy can critically
      hit and Flinch-causing Assaults last longer; the resource then
      re-accumulates through the same qualifying moves.
    steps:
      - "accumulate_character_resource"
      - "reach_resource_threshold"
      - "enter_empowered_state"
      - "exploit_state_modified_attacks"
      - "apply_target_state"
      - "trigger_anomaly_payoff"
      - "rebuild_resource"
  resource_loop: >-
    Passion Stream is a genuine build-to-state resource: it accumulates
    through Jane's own qualifying moves (Basic Attack, a qualifying Perfect
    Dodge, or a qualifying Defensive Assist) and, at its maximum, enters the
    Passion empowered state. While Passion is active, damage-dealing Special
    Attack moves can consume or restore Passion Stream, so the gauge is
    manipulated inside the state window rather than being a passive
    accumulator; after the window the same qualifying moves rebuild it.
    No explicit depletion-to-exit condition or numeric cap is recorded in
    the facts (cap is null), so the loop is documented as
    accumulation -> threshold -> empowered state -> in-state consume/restore
    -> rebuild, without asserting a spend-to-empty exit.
  burst_pattern: >-
    Ultimate and Chain Attack have no description summaries and no mechanic
    relations connecting them to Passion Stream, Passion, or Gnawed; they
    are parallel damage nodes outside the resource/state loop rather than
    cycle payoffs, state extensions, or resource accelerators.
  archetypes:
    - "evasion_fueled_attacker"
    - "resource_state_attacker"
    - "target_condition_exploiter"
  core_mechanics:
    - "evasion_to_resource_generation"
    - "resource_threshold_state_entry"
    - "self_state_attack_modification"
    - "target_state_application"
    - "target_state_anomaly_payoff"
character_design:
  character_fantasy: >-
    Playing Jane Doe is an evasion-fueled escalation experience: the player
    dodges and defends to build Passion Stream, crosses a threshold into the
    Passion empowered state with enhanced attacks, marks enemies with Gnawed
    through every attack, and cashes the marks out through Anomaly payoffs
    (Assaults that can critically hit and extend Flinch) before rebuilding
    the gauge — a fantasy of resource-driven escalation built on evasive
    movement and target pressure rather than raw button-mashing aggression.
