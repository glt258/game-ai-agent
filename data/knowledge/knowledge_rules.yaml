version: "0.1"

description: >
  临洲世界 Knowledge Boundary 规则。文件定义不同身份在正常制度条件下可以接触哪些 Lore，
  不代表角色已经阅读、记住、理解或相信这些信息。

principles:
  default_policy: deny
  public_lore_access: allow
  relationship_does_not_imply_access: true
  faction_membership_does_not_imply_full_access: true
  knowledge_does_not_imply_belief: true

vocabulary:
  subject_types:
    - everyone
    - faction
    - division
    - role
    - responsibility
    - assignment
    - explicit_grant

  condition_types:
    relevant_professional_context:
      evaluator: has_relevant_responsibility
      description: 角色当前职责或岗位语境必须与该 Lore 涉及的专业工作直接相关。
    relevant_member_context:
      evaluator: has_relevant_responsibility
      description: 角色必须承担与该社区或组织内部议题直接相关的成员工作或讨论职责。
    assigned_to_related_project:
      evaluator: assignment_match
      description: 角色必须被分配到与该 Lore 直接相关的项目或任务。
    relevant_project:
      evaluator: assignment_match
      description: 角色当前必须存在与该 Lore 直接相关的项目 assignment。
    assigned_to_related_case:
      evaluator: case_assignment_match
      description: 角色必须被分配到与该 Lore 直接相关的案件。
    authorized_for_dataset:
      evaluator: explicit_authorization
      description: 角色必须拥有读取相关数据集的明确授权。
    authorized_for_related_review:
      evaluator: explicit_authorization
      description: 角色必须拥有参与相关审查工作的明确授权。
    authorized_for_model_review:
      evaluator: explicit_authorization
      description: 角色必须拥有参与对应模型审查工作的明确授权。
    authorized_for_pilot:
      evaluator: explicit_authorization
      description: 角色必须拥有参与对应试点项目的明确授权。
    current_rotation:
      evaluator: active_role_assignment
      description: 角色当前必须实际处于对应轮值岗位。
    assigned_to_related_artist_team:
      evaluator: artist_team_match
      description: 角色当前必须属于与该受限信息相关的艺人团队。
    assigned_to_incident_review:
      evaluator: incident_assignment_match
      description: 角色当前必须被分配到对应事故复盘任务。
    assigned_to_related_incident:
      evaluator: incident_assignment_match
      description: 角色必须承担与该 Lore 对应事故相关的专业职责。
    authorized_for_related_project:
      evaluator: explicit_authorization
      description: 角色必须拥有参与对应项目的明确授权。

  role_types:
    research_ethics_authorized_staff:
      faction_id: faction_002
      description: 研究伦理与数据授权相关工作人员。
    project_lead:
      faction_id: faction_002
      description: 指定研究项目的负责人。
    principal_investigator:
      faction_id: faction_002
      description: 正式研究项目的首席研究负责人。
    data_office_authorized_member:
      faction_id: faction_002
      description: 研究中心数据办公室中获得相关数据授权的成员。
    research_ethics_lead:
      faction_id: faction_002
      description: 负责相关研究伦理审查与授权的负责人。
    center_director:
      faction_id: faction_002
      description: 临洲大学行为与能力研究中心主任。
    compliance_lead:
      faction_id: faction_003
      description: 衡信保险相关合规项目负责人。
    manager:
      faction_id: faction_003
      description: 衡信保险承担相关项目管理职责的管理人员。
    board_risk_committee_member:
      faction_id: faction_003
      description: 衡信保险董事会风险委员会成员。
    chief_actuary:
      faction_id: faction_003
      description: 衡信保险首席精算负责人。
    model_governance_lead:
      faction_id: faction_003
      description: 衡信保险模型治理相关负责人。
    legal_staff:
      faction_id: faction_004
      description: 霓桥传媒法务工作人员。
    rotating_coordinator:
      faction_id: faction_006
      description: 当前轮值的合作社协调人。
    legal_lead:
      faction_id: faction_003
      description: 衡信保险相关法务负责人。

  responsibility_types:
    department_training:
      faction_id: faction_005
      description: 承担相关部门培训职责。
    incident_professional_lead:
      faction_id: faction_005
      description: 承担事故相关专业负责人职责。
    mediation_case_coordination:
      faction_id: faction_001
      description: 承担跨机构协理案件的事实整理、沟通与协调职责。

  assignment_types:
    hengxin_explainability_pilot:
      faction_id: faction_003
      description: 衡信风险因子解释机制试点项目。

  exclusion_predicates: {}

  acquisition_channels:
    - public_information
    - public_report
    - internal_training
    - internal_documentation
    - professional_work
    - project_briefing
    - case_assignment
    - restricted_database
    - authorized_research_data
    - confidential_briefing
    - community_meeting

validation:
  require_registered_subject_type: true
  require_registered_condition: true
  require_registered_role: true
  require_registered_responsibility: true
  require_registered_assignment: true
  require_registered_acquisition_channel: true
  forbid_relevant_prefix_in_roles: true
  forbid_ordinary_prefix_in_roles: true
  default_deny_when_no_grant_matches: true

