[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-ai-agent-public-demo"
version = "0.8.0"
description = "AI-assisted game design and development framework with synthetic demo data"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "openai>=1.0,<3", "fastapi>=0.115,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "pytest-cov>=6,<8", "coverage[toml]>=7.6,<8", "ruff>=0.16.1,<0.17", "mypy>=1.13,<2", "pre-commit>=4,<5", "build>=1.2,<2", "twine>=6,<7", "tomli>=2; python_version < '3.11'", "uvicorn>=0.30,<1"]

[project.scripts]
game-ai-agent = "game_ai_agent:main"
game-ai-agent-character-author = "agents.character_generation_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: optional test that may call a paid external LLM"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
along_street_resources = ["data/**/*.yaml", "data/**/*.yml", "data/**/*.md"]

[tool.ruff]
target-version = "py310"
line-length = 100
