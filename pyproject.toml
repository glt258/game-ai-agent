[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "along-street-knowledge-resolver"
version = "0.8.0.dev0"
description = "Default-deny NPC knowledge boundary resolver for Along the Street"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "openai>=1.0,<3"]

[project.scripts]
along-street-character-author = "agents.official_character_authoring:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: optional test that may call a paid external LLM"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
along_street_resources = ["data/**/*.yaml", "data/**/*.yml", "data/**/*.md"]
